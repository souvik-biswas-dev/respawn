[defaults]
inventory = inventory/hosts.yml
roles_path = roles
stdout_callback = default
result_format = yaml
retry_files_enabled = False
# accept-new trusts a host key on first contact, then pins it. A rebuilt server
# gets a NEW key, so remove the old line from known_hosts after a respawn.
host_key_checking = True

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
