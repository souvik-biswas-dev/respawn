---
- name: Restart ssh
  ansible.builtin.service:
    name: ssh
    state: restarted

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Load audit rules
  # auditd refuses `systemctl restart`, so rules are reloaded with augenrules.
  ansible.builtin.command: augenrules --load
  changed_when: true
