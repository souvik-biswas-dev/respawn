# EXAMPLE with a fake value. Alertmanager reads the webhook URL from this Secret (key "url"),
# so the URL never appears in Git. Real use: copy to alertmanager-webhook.enc.yaml, put the real
# URL in, encrypt with `sops --encrypt --in-place` (rules in .sops.yaml), then `make apply-secrets`.
# Namespace "monitoring" is created by `apply-secrets` if missing.
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-webhook
  namespace: monitoring
type: Opaque
stringData:
  url: https://example.invalid/replace-me
