# EXAMPLE with a fake value; encrypt as in alertmanager-webhook.example.yaml (copy to
# canary-backup-pg.enc.yaml). BackupVouch's backup Job logs in as this user and runs pg_dump.
# The password MUST equal POSTGRES_PASSWORD in canary-postgres, because for now this is the
# canary database's own owner role. A dedicated read-only role is better (BackupVouch's advice);
# that needs an init step in Postgres and is not done here.
apiVersion: v1
kind: Secret
metadata:
  name: canary-backup-pg
  namespace: canary
type: Opaque
stringData:
  username: canary
  password: replace-me-same-as-canary-postgres
