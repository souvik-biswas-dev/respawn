# BackupVouch ships the ClusterRole (get on /metrics) but no binding. Prometheus's service account
# (name from fullnameOverride "kps" in values/kube-prometheus-stack.yaml) needs one.
# UNVERIFIED names: the role is "metrics-reader" with BackupVouch's namePrefix "backupvouch-".
# Check: kubectl get clusterrole | grep metrics-reader ; kubectl -n monitoring get sa | grep prometheus
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: respawn-prometheus-backupvouch-metrics
  labels:
    app.kubernetes.io/part-of: respawn
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backupvouch-metrics-reader
subjects:
  - kind: ServiceAccount
    name: kps-prometheus
    namespace: monitoring
