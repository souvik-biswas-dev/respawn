apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: canary
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/souvik-biswas-dev/respawn.git
    targetRevision: HEAD
    path: gitops/apps/canary
  destination:
    server: https://kubernetes.default.svc
    namespace: canary
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
