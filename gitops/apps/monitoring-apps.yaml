# Four child Applications for observability. The three Helm charts use two sources:
# the upstream chart, plus this repo as "$values" so the values files stay in Git.
# Chart versions are pinned from memory (unverified): check they exist before the first sync.
# Replace YOUR-USER like in canary-app.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack # Prometheus, Alertmanager, Grafana, node-exporter, kube-state-metrics
      targetRevision: 67.4.0
      helm:
        releaseName: kps
        valueFiles:
          - $values/gitops/apps/monitoring/values/kube-prometheus-stack.yaml
    - repoURL: https://github.com/YOUR-USER/respawn.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The chart's CRDs are too large for client-side apply.
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 6.24.0
      helm:
        releaseName: loki
        valueFiles:
          - $values/gitops/apps/monitoring/values/loki.yaml
    - repoURL: https://github.com/YOUR-USER/respawn.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: promtail
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: promtail
      targetRevision: 6.16.6
      helm:
        releaseName: promtail
        valueFiles:
          - $values/gitops/apps/monitoring/values/promtail.yaml
    - repoURL: https://github.com/YOUR-USER/respawn.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
# Our own rules, scrape targets and dashboards (plain Kustomize in gitops/apps/monitoring).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR-USER/respawn.git
    targetRevision: HEAD
    path: gitops/apps/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # PrometheusRule and ServiceMonitor kinds only exist once monitoring-stack has synced its CRDs.
    retry:
      limit: 10
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
